<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Chess Master - Cờ Tướng Online</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Công cụ hiển thị Console log ngay trên điện thoại -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>

    <!-- Thư viện Pi Network SDK chuẩn -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
    <div class="game-container">
        <h1>棋 Pi Chess Master</h1>
        <div class="user-info">
            <span id="username">Đang kết nối Pi...</span>
            <span id="balance">Ví: 0 Pi</span>
        </div>

        <!-- Khu vực bàn cờ -->
        <div id="chessboard"></div>

        <!-- Khu vực nạp tiền bằng Pi coin -->
        <div class="shop-section">
            <h3>Nạp năng lượng / Mua vật phẩm</h3>
            <button class="btn-pi" onclick="payWithPi()">Nạp 1 Pi</button>
        </div>
    </div>

    <!-- Tải tệp xử lý logic -->
    <script src="script.js"></script>
</body>
</html>
